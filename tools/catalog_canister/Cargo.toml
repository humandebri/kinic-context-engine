[package]
name = "catalog_canister"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ICME-Lab/kinic-context-engine"
description = "Catalog canister for mapping logical source IDs to KINIC memory instances."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10.20"
ic-cdk = "0.20.1"
kinic_context_core = { path = "../../crates/kinic_context_core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-sqlite-vfs = { version = "=0.2.2", default-features = false, features = ["sqlite-precompiled"] }
